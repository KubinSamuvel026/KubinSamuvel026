<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="60%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#1b2740"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3350"/>
      <stop offset="100%" stop-color="#0d1a2b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf6e3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fdf6e3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="260" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f4e9d8">
    <circle cx="80" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="60" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="25" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="20" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="55" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="30" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="75" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="740" cy="55" r="46" fill="url(#moonGlow)"/>
  <circle cx="740" cy="55" r="22" fill="#f4e9d8"/>

  <!-- drifting clouds -->
  <g fill="#1b2740" opacity="0.55">
    <ellipse cx="0" cy="45" rx="60" ry="10">
      <animateTransform attributeName="transform" type="translate" values="0,0; 900,0; 0,0" dur="40s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="300" cy="90" rx="80" ry="12">
      <animateTransform attributeName="transform" type="translate" values="0,0; 700,0; 0,0" dur="55s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- distant pagoda silhouette -->
  <g fill="#0d1a2b">
    <polygon points="60,140 130,140 120,120 70,120"/>
    <rect x="90" y="105" width="10" height="16"/>
    <polygon points="100,95 110,105 90,105"/>
  </g>

  <!-- mountains / cliffs -->
  <path d="M0,160 L120,110 L220,150 L320,100 L420,155 L520,120 L620,158 L720,115 L820,150 L900,130 L900,260 L0,260 Z" fill="#14233a"/>
  <path d="M0,190 L150,150 L280,185 L400,140 L540,190 L680,150 L820,185 L900,165 L900,260 L0,260 Z" fill="#0d1a2b"/>

  <!-- sea -->
  <rect x="0" y="185" width="900" height="75" fill="url(#sea)"/>

  <!-- wave lines -->
  <g stroke="#4f7c9c" stroke-width="1.4" fill="none" opacity="0.6">
    <path d="M0,205 Q40,198 80,205 T160,205 T240,205 T320,205 T400,205 T480,205 T560,205 T640,205 T720,205 T800,205 T900,205">
      <animate attributeName="d"
        values="M0,205 Q40,198 80,205 T160,205 T240,205 T320,205 T400,205 T480,205 T560,205 T640,205 T720,205 T800,205 T900,205;
                 M0,205 Q40,212 80,205 T160,205 T240,205 T320,205 T400,205 T480,205 T560,205 T640,205 T720,205 T800,205 T900,205;
                 M0,205 Q40,198 80,205 T160,205 T240,205 T320,205 T400,205 T480,205 T560,205 T640,205 T720,205 T800,205 T900,205"
        dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,225 Q40,219 80,225 T160,225 T240,225 T320,225 T400,225 T480,225 T560,225 T640,225 T720,225 T800,225 T900,225">
      <animate attributeName="d"
        values="M0,225 Q40,219 80,225 T160,225 T240,225 T320,225 T400,225 T480,225 T560,225 T640,225 T720,225 T800,225 T900,225;
                 M0,225 Q40,231 80,225 T160,225 T240,225 T320,225 T400,225 T480,225 T560,225 T640,225 T720,225 T800,225 T900,225;
                 M0,225 Q40,219 80,225 T160,225 T240,225 T320,225 T400,225 T480,225 T560,225 T640,225 T720,225 T800,225 T900,225"
        dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- jumping dolphin -->
  <g fill="#8fb4cc">
    <path id="dolphin" d="M0,0 C10,-18 30,-20 42,-8 C46,-4 48,2 44,6 C40,10 30,8 26,4 L20,10 L22,2 C10,4 2,-2 0,0 Z"/>
  </g>
  <use href="#dolphin" fill="#8fb4cc">
    <animateMotion path="M40,235 C90,235 110,120 160,120 C210,120 220,235 270,235" dur="3.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;0" additive="sum" dur="3.6s" repeatCount="indefinite"/>
  </use>
  <use href="#dolphin" fill="#6f9ab8" opacity="0.85">
    <animateMotion path="M480,235 C530,235 550,140 600,140 C650,140 660,235 710,235" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
  </use>

  <!-- ripple where dolphin lands -->
  <g stroke="#4f7c9c" fill="none" opacity="0.7">
    <circle cx="270" cy="236" r="4">
      <animate attributeName="r" values="4;22" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="236" r="4">
      <animate attributeName="r" values="4;22" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- foreground pine silhouette -->
  <g fill="#0a1420">
    <path d="M840,260 L840,180 L830,180 L845,150 L836,150 L850,120 L842,120 L858,95 L870,120 L862,120 L876,150 L868,150 L882,180 L872,180 L872,260 Z"/>
  </g>
</svg>
